# ==============================================================================
# EnviroTrust ML Service — Data & Model Configuration
# ==============================================================================
# Flexible configuration supporting both:
#   A. Environmental-Only monitoring (pH, COD_mg_L, BOD_mg_L, TDS_mg_L, turbidity_NTU,
#      colour_PtCo, total_solids_mg_L, total_suspended_solids_mg_L, chloride_mg_L,
#      ammoniacal_nitrogen_mg_L, nitrate_mg_L)
#   B. Process-Context cross-checking (incorporating electricity_consumption, production, water_flow)
#
# All listed features are CANDIDATE features, not guaranteed dataset columns.
# Column mappings translate authentic dataset columns to canonical names.
# ==============================================================================

dataset:
  raw_data_path: "data/raw/extracted_water_quality_samples.csv"
  validation_data_path: null
  file_format: "auto"

# Column Mapping System: maps raw columns in authentic files -> canonical features
column_mapping:
  # Environmental Measurements (Authentic columns)
  pH: "pH"
  COD_mg_L: "COD_mg_L"
  BOD_mg_L: "BOD_mg_L"
  TDS_mg_L: "TDS_mg_L"
  turbidity_NTU: "turbidity_NTU"
  colour_PtCo: "colour_PtCo"
  total_solids_mg_L: "total_solids_mg_L"
  total_suspended_solids_mg_L: "total_suspended_solids_mg_L"
  chloride_mg_L: "chloride_mg_L"
  ammoniacal_nitrogen_mg_L: "ammoniacal_nitrogen_mg_L"
  nitrate_mg_L: "nitrate_mg_L"
  sulphate_mg_L: "sulphate_mg_L"

  # Factory Operational Context (Authentic columns)
  electricity_consumption: "electricity_consumption"
  production: "production"
  water_flow: "water_flow"

  # Bangladesh Textile Industry Dataset Mappings
  "Total Production (kg)": "production"
  "Total Electricity Use (kWh)": "electricity_consumption"
  "Extracted Groundwater (Million Liters)": "extracted_groundwater"
  "Discharged Wastewater (Million Liters)": "water_flow"
  "COD (mg/L)": "COD_mg_L"
  "BOD (mg/L)": "BOD_mg_L"

  # Ontario MISA 2024 Electric Power Generation Mappings
  "BIOCHEMICAL OXYGEN DEMAND, 5 DAY, TOTAL DEMAND": "BOD_kg_d"
  "FLOW": "water_flow"
  "RESIDUE, PARTICULATE": "residue_particulate_kg_d"
  "ALUMINIUM, UNFILTERED TOTAL": "aluminium_kg_d"
  "IRON, UNFILTERED TOTAL": "iron_kg_d"
  "SOLVENT EXTRACTABLES": "solvent_extractables_kg_d"

  # Cross-Industry Microorganism Dataset Mappings
  "TS (mg/L)": "total_solids_mg_L"
  "SS (mg/L)": "total_suspended_solids_mg_L"
  "VSS (mg/L)": "volatile_suspended_solids_mg_L"
  "TN (mg/L)": "total_nitrogen_mg_L"
  "TP (mg/L)": "total_phosphorus_mg_L"
  "N-NH4+ (mg/L)": "ammoniacal_nitrogen_mg_L"

  # Yellow River Basin WWTP Dataset Mappings
  "Chemical Oxygen Demand (COD)": "COD_mg_L"
  "Biochemical Oxygen Demand (BOD)": "BOD_mg_L"
  "Ammoniacal Nitrogen (NH3-N)": "ammoniacal_nitrogen_mg_L"
  "Total Nitrogen (TN)": "total_nitrogen_mg_L"
  "Total Phosphorus (TP)": "total_phosphorus_mg_L"
  "Electricity Consumption": "electricity_consumption"
  "Operational Cost": "operational_cost"

  # Industrial Mining & Critical Mineral Recovery Mappings
  "Median TDS (mg/L)": "TDS_mg_L"
  "Median pH": "pH"
  "Median TOC (mg/L)": "TOC_mg_L"
  "Hardness (mg/L as CaCO3)": "hardness_mg_L_CaCO3"

  # Legacy aliases for backward compatibility with existing tests & endpoints
  outlet_cod: "outlet_cod"
  bod: "bod"
  ph: "ph"
  tds: "tds"
  temperature: "temperature"
  turbidity: "turbidity"
  production_rate: "production_rate"
  wastewater_flow: "wastewater_flow"
  treatment_dose: "treatment_dose"
  operating_mode: "operating_mode"
  energy_consumption: "energy_consumption"

# Feature definitions for model input matrix
features:
  # Candidate numerical features (at least one must be present in the dataset)
  numerical:
    - "pH"
    - "COD_mg_L"
    - "BOD_mg_L"
    - "TDS_mg_L"
    - "turbidity_NTU"
    - "colour_PtCo"
    - "total_solids_mg_L"
    - "total_suspended_solids_mg_L"
    - "chloride_mg_L"
    - "ammoniacal_nitrogen_mg_L"
    - "nitrate_mg_L"
    - "sulphate_mg_L"
    - "electricity_consumption"
    - "production"
    - "water_flow"
    - "extracted_groundwater"
    - "BOD_kg_d"
    - "water_flow_m3_d"
    - "residue_particulate_kg_d"
    - "aluminium_kg_d"
    - "iron_kg_d"
    - "solvent_extractables_kg_d"
    - "outlet_cod"
    - "bod"
    - "ph"
    - "tds"
    - "temperature"
    - "turbidity"
    - "production_rate"
    - "wastewater_flow"
    - "treatment_dose"
    - "energy_consumption"
    - "total_nitrogen_mg_L"
    - "total_phosphorus_mg_L"
    - "volatile_suspended_solids_mg_L"
    - "operational_cost"
    - "bod_cod_ratio"
    - "TOC_mg_L"
    - "hardness_mg_L_CaCO3"
  # Candidate categorical features
  categorical:
    - "operating_mode"
  # Mandatory features specifically required (if empty, any available numerical feature is accepted)
  mandatory_features: []
  # Identifier columns (strictly excluded from ML numerical feature matrices)
  id_columns:
    - "sample_id"
    - "readingId"
    - "sensorId"
    - "Factory"
    - "factory"
    - "Works Name"
    - "works_name"
    - "Control Point Name"
    - "Sector"
    - "Component Type"
    - "Unit of Measure"
    - "Sample Date"
    - "Wastewater Type"
    - "wastewater_type"
    - "Reference Citation"
    - "reference_citation"
    - "Parameter / Metric"
    - "Unit / Notes"
    - "25%-75% / Min-Max Range"
    - "Industry Category"
    - "industry_category"
    - "Industrial Activity"
    - "industrial_activity"
    - "Wastewater Volume / Energy Metric"
    - "wastewater_volume_metric"
    - "Notes / Critical Mineral Recovery Potential"
    - "notes_recovery_potential"

# Rolling-Window Features (stuck / frozen sensor detection)
# Adds '<feature>_roll_log_std' = log1p(trailing-window std) per base measurement, per sensor
# stream, as extra Isolation Forest inputs. A stuck sensor drives it to 0. Computed only when
# the timestamp column is present (skipped for non-temporal datasets). At inference the
# predictor keeps the last few readings per sensorId in memory.
rolling_features:
  enabled: true
  window: 5                     # Readings per window (the first window-1 readings of a stream get NaN)
  base_features: null           # null = all configured numerical features present in the data
  group_column: "sensorId"      # Separate stream per sensor; absent column = one stream
  timestamp_column: "timestamp"

# CUSUM Sustained-Shift Detector (slow sensor bias / calibration drift)
# Two-sided per-feature CUSUM on values standardized by the NORMAL training mean/std; a separate
# explainable detection source next to Isolation Forest and the rules. Fitted only when the
# timestamp column is present. At inference the predictor keeps the statistics per sensorId.
cusum:
  enabled: true
  k: 1.0                        # Allowance (std units). 0.5 is textbook but false-alarms on daily cycles
  h: null                       # Decision threshold; null = calibrate on the normal validation stream
  h_margin: 0.25                # Calibrated h = validation peak statistic * (1 + h_margin) ...
  h_min: 4.0                    # ... never below h_min
  base_features: null           # null = all configured numerical features present in the data
  group_column: "sensorId"
  timestamp_column: "timestamp"

# Data Splitting Strategy
splitting:
  strategy: "chronological"     # 'chronological' (time-series) or 'random' (non-time-series)
  train_ratio: 0.80             # 80% train, 20% validation (applied after the held-out test reservation)
  test_ratio: 0.15              # Held-out test fraction, never used for fitting or calibration (0 disables)
  timestamp_column: "timestamp" # Required when strategy is 'chronological'

# Label-Aware Training (Semi-Supervised / One-Class Anomaly Detection)
# If a label column is present, Isolation Forest fits strictly on NORMAL records.
labels:
  label_column: null            # e.g., "is_anomaly", "label", "tampered"
  normal_values:
    - "normal"
    - "nominal"
    - "0"
    - "false"
    - 0
    - false
  anomaly_values:
    - "anomaly"
    - "abnormal"
    - "tampered"
    - "suspicious"
    - "1"
    - "true"
    - 1
    - true
  custom_mapping: null

# Data Preprocessing settings
preprocessing:
  numerical_imputation_strategy: "median"       # 'median', 'mean', or 'drop'
  categorical_imputation_strategy: "most_frequent"
  categorical_encoding: "onehot"                # 'onehot' with handle_unknown='ignore'
  scale_features: false

# Isolation Forest Hyperparameters (scikit-learn)
isolation_forest:
  n_estimators: 150
  max_samples: "auto"
  contamination: "auto"
  random_state: 42
  bootstrap: false
  n_jobs: -1

# Validation and Data Hygiene
validation:
  min_rows: 10                                  # Minimum samples required to attempt model training
  max_missing_ratio: 0.5

# Anomaly Threshold Calibration
calibration:
  threshold_percentile: 99.0
  fallback_threshold: 0.65
  manual_threshold: null

# Physical Consistency Rules (explainable checks alongside Isolation Forest)
# Fixed invariants (pH 0-14, non-negative concentrations, BOD <= COD, chloride + sulphate <= TDS,
# TS ~= TDS + TSS) plus envelopes learned from NORMAL training records only.
consistency_rules:
  enabled: true
  envelope_quantiles: [0.005, 0.995]          # Per-feature quantile band learned from training data
  envelope_margin: 0.10                       # Band widened by this fraction of its width on each side
  ratio_pairs:                                # Learned ratio bands (numerator, denominator)
    - ["BOD_mg_L", "COD_mg_L"]
    - ["turbidity_NTU", "total_suspended_solids_mg_L"]
  ratio_margin: 0.10
  solids_balance_tolerance: 0.10              # Max relative |TS - (TDS + TSS)| / TS

# Model Artifact Locations
artifacts:
  models_dir: "models"
  model_filename: "isolation_forest.joblib"
  preprocessor_filename: "preprocessor.joblib"
  metadata_filename: "model_metadata.json"
  rules_filename: "consistency_rules.json"
  cusum_filename: "cusum.json"
